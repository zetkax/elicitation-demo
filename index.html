<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A static SurveyJS prototype for eliciting uncertainty about a restaurant-reservation AI agent."
    />
    <title>Restaurant agent | Expert elicitation prototype</title>

    <!-- SurveyJS Form Library only. Versions are pinned for a reproducible demo. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/survey-core@2.5.40/survey-core.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />

    <script src="https://unpkg.com/survey-core@2.5.40/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui@2.5.40/survey-js-ui.min.js"></script>
    <script src="survey.js" defer></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header" aria-label="Prototype header">
        <a class="brand" href="./" aria-label="Expert elicitation prototype home">
          
          <span>
            <strong>Expert elicitation</strong>
            <small>DEMO</small>
          </span>
        </a>
        
      </header>

      <main>
        <div id="surveyContainer" aria-live="polite"></div>
        <noscript>
          <p class="noscript-message">
            This prototype needs JavaScript to calculate the follow-up question and
            uncertainty distribution.
          </p>
        </noscript>
      </main>

      <footer class="site-footer">
        Prototype
      </footer>
    </div>
  </body>
</html>
